<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0 }; }
  componentDidMount() {
    const s = Date.now();
    this.t = setInterval(() => { const k = Math.min(1, (Date.now() - s - 200) / 1600); if (k < 0) return; this.setState({ n: Math.round(158 * (1 - Math.pow(1 - k, 3))) }); if (k >= 1) clearInterval(this.t); }, 30);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() { return { n: this.state.n }; }
}
</script>
