<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>country</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="country">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#FFFFFF;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;left:0;top:env(safe-area-inset-top,0px);border:0;display:block;background:#FFFFFF;transform-origin:0 0}
</style>
</head>
<body>
<iframe id="app" title="country" src="app/Main.dc.html"></iframe>
<script>
(function(){
  var app=document.getElementById('app');
  function fit(){
    var top=parseFloat(getComputedStyle(app).top)||0;
    var w=window.innerWidth,h=window.innerHeight-top,k=Math.min(w/390,1.2);
    app.style.width='390px';app.style.height=(h/k)+'px';app.style.transform='scale('+k+')';
    app.style.left=((w-390*k)/2)+'px';
  }
  function dress(){
    var d;try{d=app.contentDocument}catch(e){return}
    if(!d)return;var st=d.getElementById('__app');
    if(!st){st=d.createElement('style');st.id='__app';(d.head||d.documentElement).appendChild(st)}
    var css='html{scrollbar-width:none;-webkit-tap-highlight-color:transparent}::-webkit-scrollbar{display:none}nav[aria-label="Main"]{position:fixed!important;left:0;bottom:0;z-index:50}';
    try{if(app.contentWindow.location.pathname.indexOf('ReportPDF')>-1)css+='body{zoom:.49}'}catch(e){}
    st.textContent=css;
  }
  app.addEventListener('load',function(){dress();setTimeout(dress,400);setTimeout(dress,1200)});
  window.addEventListener('resize',fit);fit();
  if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
</body>
</html>
