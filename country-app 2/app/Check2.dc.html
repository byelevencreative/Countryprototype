<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick check: your trips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;color:#1C2B26}
a{color:#264E43;text-decoration:none}a:hover{color:#1C2B26}
button{font-family:inherit}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sweep{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.stg>*{animation:rise .45s ease-out both}.stg>*:nth-child(2){animation-delay:.06s}.stg>*:nth-child(3){animation-delay:.12s}.stg>*:nth-child(4){animation-delay:.18s}.stg>*:nth-child(5){animation-delay:.24s}.stg>*:nth-child(n+6){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div class="stg" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; padding: 52px 24px 34px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="Check1.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="flex-grow: 1; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #5E6D67">QUICK CHECK · 2 OF 3</span>
    <span style="height: 24px; padding: 0 9px; border-radius: 12px; background: #F5F1E8; display: flex; align-items: center; font-size: 11px; font-weight: 700; color: #264E43">FREE</span>
  </div>

  <h1 style="margin: 18px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; color: #264E43">When were you in Schengen?</h1>
  <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #4F6159">Add your trips from the last 180 days, since 30 March.</p>

  <div style="margin-top: 16px; padding: 12px; border-radius: 18px; border: 1px solid #E3DED2">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #264E43"><dc-import name="Flag" code="es" w="20" h="14" hint-size="20px,14px"></dc-import>August 2026</span>
      <span style="font-size: 12px; color: #5E6D67">Drag across the days</span>
    </div>
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 3px; font-size: 13px; text-align: center">
      <span style="font-size: 11px; color: #7A8983">M</span><span style="font-size: 11px; color: #7A8983">T</span><span style="font-size: 11px; color: #7A8983">W</span><span style="font-size: 11px; color: #7A8983">T</span><span style="font-size: 11px; color: #7A8983">F</span><span style="font-size: 11px; color: #7A8983">S</span><span style="font-size: 11px; color: #7A8983">S</span>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
        <span style="height: 30px; display: flex; align-items: center; justify-content: center; background: {{d.bg}}; color: {{d.fg}}; border-radius: {{d.r}}; font-weight: {{d.fw}}; animation: {{d.anim}}">{{d.n}}</span>
      </sc-for>
    </div>
  </div>

  <div class="stg" style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{trips}}" as="t" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 6px 0 14px; border-radius: 14px; background: #F5F1E8">
        <dc-import name="Flag" code="{{t.code}}" w="22" h="15" hint-size="22px,15px"></dc-import>
        <span style="flex-grow: 1; font-size: 14px"><b style="font-weight: 600">{{t.name}}</b> · {{t.dates}}</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 14px; color: #264E43">{{t.days}}d</span>
        <button aria-label="Remove trip" style="width: 36px; height: 36px; border: none; background: none; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7A8983" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
    </sc-for>
  </div>
  <button style="margin-top: 8px; height: 46px; border-radius: 14px; border: 1.5px dashed #6D9488; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #264E43; cursor: pointer">+ Add another trip</button>

  <div style="flex-grow: 1"></div>
  <a href="Check3.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #264E43; color: #FFFFFF; font-weight: 600; font-size: 16px">Count my days</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const days = [];
    const lead = 5;
    for (let i = 0; i < lead; i++) days.push({ n: '', bg: 'transparent', fg: '#1C2B26', r: '0', fw: '400', anim: 'none' });
    for (let n = 1; n <= 31; n++) {
      const inR = n <= 20, edge = n === 1 || n === 20;
      days.push({ n, bg: edge ? '#264E43' : (inR ? '#CFE8FF' : 'transparent'), fg: edge ? '#FFFFFF' : (inR ? '#264E43' : '#1C2B26'), fw: inR ? '600' : '400',
        r: n === 1 ? '15px 0 0 15px' : (n === 20 ? '0 15px 15px 0' : (inR ? '0' : '15px')),
        anim: inR ? `sweep .25s ease-out ${(0.4 + n * 0.03).toFixed(2)}s both` : 'none' });
    }
    const trips = [
      { code: 'it', name: 'Italy', dates: '14 – 21 Apr', days: 8 },
      { code: 'fr', name: 'France', dates: '10 – 21 May', days: 12 },
      { code: 'es', name: 'Spain', dates: '12 – 26 Jun', days: 15 },
      { code: 'es', name: 'Spain', dates: '1 – 20 Aug', days: 20 }
    ];
    return { days, trips };
  }
}
</script>
</body>
</html>
