<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick check: what to check</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;color:#1C2B26}
a{color:#264E43;text-decoration:none}a:hover{color:#1C2B26}
button{font-family:inherit}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stg>*{animation:rise .45s ease-out both}.stg>*:nth-child(2){animation-delay:.06s}.stg>*:nth-child(3){animation-delay:.12s}.stg>*:nth-child(4){animation-delay:.18s}.stg>*:nth-child(5){animation-delay:.24s}.stg>*:nth-child(n+6){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div class="stg" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; padding: 52px 24px 34px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="FreeHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="flex-grow: 1; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #5E6D67">QUICK CHECK · 1 OF 3</span>
    <span style="height: 24px; padding: 0 9px; border-radius: 12px; background: #F5F1E8; display: flex; align-items: center; font-size: 11px; font-weight: 700; color: #264E43">FREE</span>
  </div>

  <h1 style="margin: 18px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; color: #264E43">What do you want to check?</h1>
  <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #4F6159">One rule, one answer. No sign-up.</p>

  <div role="radiogroup" aria-label="Rule" class="stg" style="margin-top: 22px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rules}}" as="r" hint-placeholder-count="4">
      <button role="radio" aria-checked="{{r.aria}}" onClick="{{r.pick}}" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 12px 16px; border-radius: 16px; border: 1.5px solid {{r.bd}}; background: {{r.bg}}; text-align: left; cursor: pointer">
        <dc-import name="Flag" code="{{r.code}}" w="32" h="22" hint-size="32px,22px"></dc-import>
        <span style="flex-grow: 1"><span style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15.5px; color: #1C2B26">{{r.name}}<sc-if value="{{r.popular}}" hint-placeholder-val="{{false}}"><span style="height: 20px; padding: 0 7px; border-radius: 10px; background: #264E43; color: #FFFFFF; font-size: 10.5px; font-weight: 600; display: inline-flex; align-items: center">Most checked</span></sc-if></span><span style="display: block; margin-top: 2px; font-size: 13px; color: #5E6D67">{{r.sub}}</span></span>
        <span style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid {{r.bd}}; background: {{r.dot}}; box-shadow: inset 0 0 0 4px #FFFFFF; flex-shrink: 0"></span>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: 16px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #F5F1E8; font-size: 13.5px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2.5"></rect><path d="M4 9.5h16M8.5 3v4M15.5 3v4"></path></svg>
    <span style="flex-grow: 1">Check as of <b>today, 25 Sep</b></span>
    <span style="font-size: 13px; font-weight: 600; color: #264E43">Change</span>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="Check2.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #264E43; color: #FFFFFF; font-weight: 600; font-size: 16px">Next: add my trips</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 'eu' }; }
  renderVals() {
    const R = [
      ['eu', 'Schengen', '90 days in any 180', true],
      ['ae', 'UAE tax residency', '183 days in 12 months', false],
      ['uk', 'United Kingdom', 'Days in the UK tax year', false],
      ['us', 'United States', 'Substantial presence, 183 days', false]
    ];
    const rules = R.map(([code, name, sub, popular]) => {
      const on = this.state.pick === code;
      return { code, name, sub, popular, aria: on ? 'true' : 'false', bd: on ? '#264E43' : '#E3DED2', bg: on ? '#EEF6FF' : '#FFFFFF', dot: on ? '#264E43' : '#FFFFFF', pick: () => this.setState({ pick: code }) };
    });
    return { rules };
  }
}
</script>
</body>
</html>
