<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All stamps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;color:#1C2B26}
a{color:#264E43;text-decoration:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 1010px; box-sizing: border-box; background: #FFFFFF; padding: 52px 20px 30px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Passport.dc.html" aria-label="Back to your passport" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.02em; color: #264E43">All stamps</h1>
  </div>
  <p style="margin: 2px 0 0; font-size: 14px; color: #4F6159">17 stamps · 14 countries. Tap one to open its page.</p>
  <sc-for list="{{years}}" as="y" hint-placeholder-count="2">
    <div style="margin-top: 20px; display: flex; align-items: baseline; justify-content: space-between"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 20px; color: #264E43">{{y.year}}</span><span style="font-size: 12px; color: #5E6D67">{{y.count}}</span></div>
    <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{y.items}}" as="s" hint-placeholder-count="8">
        <a href="Passport.dc.html" style="padding: 8px 4px 8px; border-radius: 12px; background: #F5F1E8; display: flex; flex-direction: column; align-items: center; gap: 6px; animation: rise .35s ease-out {{s.t}} both">
          <span style="height: 70px; display: flex; align-items: center; justify-content: center"><dc-import name="Stamp" code="{{s.code}}" mode="{{s.mode}}" date="{{s.date}}" w="100" hint-size="100px,67px"></dc-import></span>
          <span style="font-size: 11px; font-weight: 600; color: #3D5048; white-space: nowrap">{{s.label}}</span>
        </a>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1010}}'>
class Component extends DCLogic {
  renderVals() {
    // Every entry gets a stamp. Newest first. [code, mode, stamp date, label]
    const ALL = [
      [2026, 'ae', 'air', '1 4  SEP  2026', 'UAE · 14 Sep'],
      [2026, 'gb', 'air', '07 SEP 2026', 'UK · 7 Sep'],
      [2026, 'gb', 'land', '01 JUL 2026', 'UK · 1 Jul'],
      [2026, 'es', 'air', '12.06.26', 'Spain · 12 Jun'],
      [2026, 'fr', 'air', '10.05.26', 'France · 10 May'],
      [2026, 'it', 'air', '14.04.26', 'Italy · 14 Apr'],
      [2026, 'gb', 'air', '21 MAR 2026', 'UK · 21 Mar'],
      [2026, 'us', 'air', 'JAN 21 2026', 'USA · 21 Jan'],
      [2025, 'mv', 'air', '28 DEC 2025', 'Maldives · 28 Dec'],
      [2025, 'om', 'land', '02-11-2025', 'Oman · 2 Nov'],
      [2025, 'tr', 'sea', '09.10.2025', 'Türkiye · 9 Oct'],
      [2025, 'pt', 'air', '03.08.25', 'Portugal · 3 Aug'],
      [2025, 'ge', 'air', '15.06.25', 'Georgia · 15 Jun'],
      [2025, 'sg', 'air', '20 APR 2025', 'Singapore · 20 Apr'],
      [2025, 'th', 'air', '18 APR 2025', 'Thailand · 18 Apr'],
      [2025, 'jp', 'air', '02 MAR 2025', 'Japan · 2 Mar'],
      [2025, 'gb', 'air', '10 JAN 2025', 'UK · 10 Jan'],
    ];

    const years = [2026, 2025].map(y => { const it = ALL.filter(s => s[0] === y); return { year: y, count: it.length + ' stamps · ' + Math.ceil(it.length / 6) + ' pages', items: it.map(([, code, mode, date, label], i) => ({ code, mode, date, label, t: (0.03 * i).toFixed(2) + 's' })) }; });
    return { years };
  }
}
</script>
</body>
</html>
