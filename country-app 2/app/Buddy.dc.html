<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ring buddy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
</style>
</helmet>
<span style="display: inline-block; width: {{s}}px; height: {{s}}px; line-height: 0; animation: bob 2.6s ease-in-out infinite">
  <svg width="100%" height="100%" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <circle cx="50" cy="50" r="40" fill="{{face}}"></circle>
    <circle cx="50" cy="50" r="40" stroke="{{track}}" stroke-width="10"></circle>
    <circle cx="50" cy="50" r="40" stroke="#264E43" stroke-width="10" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="{{off}}" transform="rotate(-90 50 50)"></circle>
    <g style="transform-box: fill-box; transform-origin: center; animation: blink 4s infinite">
      <sc-if value="{{wink}}" hint-placeholder-val="{{false}}"><path d="M34 44q4-4 8 0" stroke="#264E43" stroke-width="3.2" stroke-linecap="round"></path></sc-if>
      <sc-if value="{{noWink}}" hint-placeholder-val="{{true}}"><ellipse cx="38" cy="44" rx="3.6" ry="4.6" fill="#264E43"></ellipse></sc-if>
      <ellipse cx="62" cy="44" rx="3.6" ry="4.6" fill="#264E43"></ellipse>
    </g>
    <sc-if value="{{happy}}" hint-placeholder-val="{{true}}"><path d="M40 57q10 9 20 0" stroke="#264E43" stroke-width="3.4" stroke-linecap="round"></path></sc-if>
    <sc-if value="{{proud}}" hint-placeholder-val="{{false}}"><path d="M38 55q12 14 24 0z" fill="#264E43"></path></sc-if>
    <sc-if value="{{calm}}" hint-placeholder-val="{{false}}"><path d="M42 59h16" stroke="#264E43" stroke-width="3.4" stroke-linecap="round"></path></sc-if>
    <sc-if value="{{cheeks}}" hint-placeholder-val="{{true}}"><g fill="#F2A7A0" opacity="0.7"><ellipse cx="30" cy="54" rx="4" ry="2.6"></ellipse><ellipse cx="70" cy="54" rx="4" ry="2.6"></ellipse></g></sc-if>
  </svg>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["happy","wink","proud","calm"],"default":"happy"},"s":{"editor":"int","default":96},"fill":{"editor":"range","min":0,"max":100,"default":86},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.mood || 'happy';
    const f = this.props.fill ?? 86;
    return {
      s: this.props.s ?? 96,
      off: (251.3 * (1 - f / 100)).toFixed(1),
      face: '#E4F1FE', track: '#CFE3D9',
      wink: m === 'wink', noWink: m !== 'wink',
      happy: m === 'happy' || m === 'wink', proud: m === 'proud', calm: m === 'calm',
      cheeks: m !== 'calm'
    };
  }
}
</script>
</body>
</html>
