<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wishlist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;color:#1C2B26}
a{color:#264E43;text-decoration:none}a:hover{color:#1C2B26}
button{font-family:inherit}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stg>*{animation:rise .4s ease-out both}.stg>*:nth-child(2){animation-delay:.05s}.stg>*:nth-child(3){animation-delay:.1s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex-grow: 1; padding: 52px 20px 0; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Countries.dc.html" aria-label="Back to your countries" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.02em; color: #264E43">Wishlist</h1>
    </div>
    <p style="margin: 6px 0 0; font-size: 14px; color: #5E6D67">{{sub}}</p>

    <sc-if value="{{has}}" hint-placeholder-val="{{true}}">
      <div class="stg" style="margin-top: 18px; display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{wish}}" as="w" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 14px; border-radius: 16px; background: #FDF2F1">
            <dc-import name="Flag" code="{{w.code}}" w="34" h="24" hint-size="34px,24px"></dc-import>
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15.5px; font-weight: 600">{{w.name}}</span><span style="font-size: 12px; color: #5E6D67">{{w.note}}</span></span>
            <a href="Planner.dc.html" style="height: 34px; padding: 0 13px; border-radius: 17px; background: #264E43; display: flex; align-items: center; font-size: 12.5px; font-weight: 600; color: #FFFFFF">Plan a trip</a>
            <button onClick="{{w.remove}}" aria-label="Remove {{w.name}} from wishlist" style="width: 36px; height: 36px; padding: 0; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#C0262D" stroke="#C0262D" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"></path></svg></button>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 40px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px">
        <span style="width: 64px; height: 64px; border-radius: 32px; background: #FDF2F1; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C0262D" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"></path></svg></span>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; color: #264E43">Nowhere saved yet</div>
        <div style="max-width: 260px; font-size: 14px; line-height: 1.5; color: #5E6D67">Tap the heart on any country you haven't been to and it'll wait for you here.</div>
      </div>
    </sc-if>

    <a href="Countries.dc.html" style="margin-top: 18px; height: 48px; border-radius: 14px; border: 1px dashed #C9D3CE; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; color: #264E43"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add more countries</a>
  </div>
  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%); padding: 10px 16px; border-radius: 12px; background: #1C2B26; color: #FFFFFF; font-size: 13px; font-weight: 500; white-space: nowrap; z-index: 5">{{toast}}</div></sc-if>
  <dc-import name="TabBar" active="map" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { wish: ['pt', 'de'], toast: '' }; }
  renderVals() {
    const NAMES = { pt: 'Portugal', de: 'Germany' };
    const NOTES = { pt: 'Saved 2 Sep', de: 'Saved 18 Aug' };
    const W = this.state.wish;
    const wish = W.map(code => ({ code, name: NAMES[code], note: NOTES[code], remove: () => {
      this.setState({ wish: W.filter(c => c !== code), toast: NAMES[code] + ' removed from wishlist' });
      clearTimeout(this.tt); this.tt = setTimeout(() => this.setState({ toast: '' }), 1800);
    } }));
    return { wish, has: W.length > 0, empty: W.length === 0, toast: this.state.toast,
      sub: W.length ? W.length + (W.length === 1 ? ' country' : ' countries') + ' you want to visit' : 'Countries you want to visit' };
  }
}
</script>
</body>
</html>
