<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>You</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;color:#1C2B26}
a{color:#264E43;text-decoration:none}a:hover{color:#1C2B26}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stg>*{animation:rise .45s ease-out both}.stg>*:nth-child(2){animation-delay:.06s}.stg>*:nth-child(3){animation-delay:.12s}.stg>*:nth-child(n+4){animation-delay:.18s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 1560px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column">
  <div class="stg" style="flex-grow: 1; padding: 54px 24px 24px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Today.dc.html" aria-label="Back to Today" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; color: #264E43">You</h1>
    </div>

    <div style="margin-top: 16px; display: flex; align-items: center; gap: 14px">
      <span style="width: 56px; height: 56px; border-radius: 28px; background: #264E43; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; color: #CFE8FF">A</span>
      <span><span style="display: block; font-weight: 600; font-size: 17px">Anna</span><span style="display: block; font-size: 13px; color: #5E6D67">Free plan · counting since 25 Sep</span></span>
    </div>

    <a href="SignIn.dc.html" style="margin-top: 16px; display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 18px; background: #E4F1FE; color: #264E43">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.7-1A4.5 4.5 0 0 0 7 18z"></path><path d="M12 15v-5M9.5 12.5L12 10l2.5 2.5"></path></svg>
      <span style="flex-grow: 1"><span style="display: block; font-weight: 600; font-size: 14.5px">Back up your days</span><span style="display: block; font-size: 12.5px">Sign in with Apple or Google</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
      <div style="margin-top: 22px">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #5E6D67">{{g.title}}</div>
        <div style="margin-top: 4px; display: flex; flex-direction: column">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <a href="{{r.href}}" style="display: flex; align-items: center; gap: 10px; min-height: 50px; border-bottom: 1px solid #EFEBE2; color: {{r.fg}}">
              <span style="flex-grow: 1; font-size: 15px">{{r.label}}</span>
              <span style="font-size: 13.5px; color: #5E6D67; text-align: right">{{r.value}}</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA59F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <div style="margin-top: 24px; text-align: center; font-size: 12px; color: #7A8983">country · version [X.Y]</div>
  </div>
  <dc-import name="TabBar" active="none" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  renderVals() {
    const R = (label, value, href) => ({ label, value: value || '', href: href || '#', fg: '#1C2B26' });
    const groups = [
      { title: 'PROFILE', rows: [R('Name', 'Anna'), R('Passports', 'United Kingdom'), R('Home base', 'UAE'), R('Goals', 'Tax, visa days')] },
      { title: 'COUNTRIES AND RULES', rows: [R('Countries I track', '4'), R('Tax year start', 'Per country'), R('UK ties', '2'), R('Add a residence permit', '')] },
      { title: 'TRACKING', rows: [R('Location', 'Always'), R('Arrival check-ins', 'On'), R('Find trips in photos', ''), R('Add past trips', '', 'PastTrips.dc.html')] },
      { title: 'ALERTS', rows: [R('First heads-up', '30 days before a limit'), R('Daily count', 'Silent'), R('Monthly summary', 'On')] },
      { title: 'PREMIUM', rows: [R('Your plan', 'Free', 'Paywall.dc.html'), R('Restore purchase', '')] },
      { title: 'APP', rows: [R('Language', 'English'), R('Date format', '25 Sep 2026'), R('Widgets', '', 'Widgets.dc.html'), R('Help and contact', ''), R('Rate country', '')] },
      { title: 'DATA AND PRIVACY', rows: [R('Export all my data', 'CSV, JSON'), R('Privacy policy', ''), R('Terms and conditions', ''), { label: 'Delete account and data', value: '', href: '#', fg: '#A8423B' }] }
    ];
    return { groups };
  }
}
</script>
</body>
</html>
