<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New country detected</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;color:#1C2B26}
a{color:#264E43;text-decoration:none}a:hover{color:#1C2B26}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes shade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes thunk{0%{opacity:0;transform:scale(1.8) rotate(-4deg)}60%{opacity:1;transform:scale(.93)}80%{transform:scale(1.03)}100%{opacity:1;transform:none}}
@keyframes ink{0%{opacity:.0}100%{opacity:.14}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #56716A; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; animation: shade .4s ease-out both">
  <div style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 24px 34px; display: flex; flex-direction: column; align-items: center; text-align: center; animation: sheet .45s cubic-bezier(.2,.9,.3,1) .1s both">
    <span style="width: 40px; height: 5px; border-radius: 3px; background: #E3DED2"></span>
    <div style="position: relative; margin-top: 18px; width: 200px; height: 150px">
      <span style="position: absolute; left: 30px; top: 30px; width: 140px; height: 90px; border-radius: 50%; background: #C0262D; filter: blur(18px); animation: ink .6s ease-out .75s both"></span>
      <svg width="200" height="150" viewBox="0 0 200 150" fill="none" style="position: relative; animation: thunk .5s cubic-bezier(.3,1.4,.5,1) .55s both" aria-hidden="true">
        <g transform="rotate(-8 100 75)">
          <rect x="22" y="22" width="156" height="106" rx="10" stroke="#C0262D" stroke-width="3"></rect>
          <rect x="31" y="31" width="138" height="88" rx="5" stroke="#C0262D" stroke-width="1.2" stroke-dasharray="4 3"></rect>
          <text x="100" y="66" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="26" fill="#C0262D">ESPAÑA</text>
          <text x="100" y="88" text-anchor="middle" font-family="JetBrains Mono" font-size="11" letter-spacing="1.5" fill="#C0262D">MAD · 10 OCT 2026</text>
          <text x="100" y="106" text-anchor="middle" font-family="JetBrains Mono" font-size="10" letter-spacing="1.5" fill="#C0262D">DAY 1</text>
        </g>
      </svg>
    </div>
    <div style="margin-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #6D9488; animation: rise .4s ease-out 1s both">NEW COUNTRY</div>
    <h1 style="margin: 6px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; color: #264E43; animation: rise .4s ease-out 1.1s both">Welcome to Spain.</h1>
    <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: #3D5048; animation: rise .4s ease-out 1.2s both">Looks like you've landed in Madrid. Should we start counting?</p>

    <div style="margin-top: 18px; align-self: stretch; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #F5F1E8; text-align: left; animation: rise .4s ease-out 1.3s both">
      <dc-import name="Flag" code="eu" w="28" h="20" hint-size="28px,20px"></dc-import>
      <span style="flex-grow: 1; font-size: 13.5px; line-height: 1.4">Today is day <b>56 of 90</b> in Schengen.<br><span style="color: #5E6D67">34 days left in this 180-day window.</span></span>
    </div>

    <a href="Today.dc.html" style="margin-top: 22px; align-self: stretch; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #264E43; color: #FFFFFF; font-weight: 600; font-size: 16px">Yes, I'm in Spain</a>
    <div style="margin-top: 10px; align-self: stretch; display: flex; gap: 10px">
      <a href="Today.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 16px; border: 1.5px solid #264E43; font-weight: 600; font-size: 14px">Just passing through</a>
      <a href="EditDay.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 16px; border: 1.5px solid #264E43; font-weight: 600; font-size: 14px">Wrong country</a>
    </div>
    <p style="margin: 14px 0 0; font-size: 12px; color: #5E6D67">Transit? Airside-only days don't count for Schengen.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
