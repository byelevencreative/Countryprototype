<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your goals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;color:#1C2B26}
a{color:#264E43;text-decoration:none}a:hover{color:#1C2B26}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stg>*{animation:rise .45s ease-out both}.stg>*:nth-child(2){animation-delay:.06s}.stg>*:nth-child(3){animation-delay:.12s}.stg>*:nth-child(4){animation-delay:.18s}.stg>*:nth-child(5){animation-delay:.24s}.stg>*:nth-child(6){animation-delay:.3s}.stg>*:nth-child(7){animation-delay:.36s}.stg>*:nth-child(n+8){animation-delay:.42s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
button{font-family:inherit}
</style>
</helmet>
<div class="stg" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; padding: 52px 24px 36px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex-grow: 1; display: flex; gap: 6px"><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #264E43"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #E3DED2"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #E3DED2"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #E3DED2"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #E3DED2"></span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #E3DED2"></span></div>
  </div>
  <h1 style="margin: 24px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; color: #264E43">What brings you to country?</h1>
  <p style="margin: 10px 0 0; font-size: 15px; color: #4F6159">Pick all that apply. We'll set up your rules around them.</p>

  <div class="stg" style="display: flex; flex-direction: column; gap: 10px; margin-top: 26px">
    <button onClick="{{g.travel.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 66px; padding: 12px 16px; border-radius: 16px; border: 1.5px solid {{g.travel.bd}}; background: {{g.travel.bg}}; text-align: left; cursor: pointer">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#264E43" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="22" r="2.5"></circle><circle cx="23" cy="8" r="2.5"></circle><path d="M9.5 21C17 20 13 10 20.5 9" stroke-dasharray="2.2 2.6"></path></svg>
      <span style="flex-grow: 1"><span style="display: block; font-weight: 600; font-size: 15px; color: #1C2B26">Track my travel</span><span style="display: block; font-size: 13px; color: #5E6D67; margin-top: 2px">Every trip and day, logged for you</span></span>
      <span style="width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid {{g.travel.bd}}; background: {{g.travel.dot}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.2l2.6 2.6L11 4.5"></path></svg></span>
    </button>
    <button onClick="{{g.tax.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 66px; padding: 12px 16px; border-radius: 16px; border: 1.5px solid {{g.tax.bd}}; background: {{g.tax.bg}}; text-align: left; cursor: pointer">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#264E43" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="15" cy="15" r="10.5" stroke-opacity="0.3"></circle><path d="M15 4.5A10.5 10.5 0 1 1 5.2 18.8"></path><path d="M11.5 12v6M14.5 12v6M17.5 12v6"></path></svg>
      <span style="flex-grow: 1"><span style="display: block; font-weight: 600; font-size: 15px; color: #1C2B26">Tax residency</span><span style="display: block; font-size: 13px; color: #5E6D67; margin-top: 2px">Hit or stay under day thresholds</span></span>
      <span style="width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid {{g.tax.bd}}; background: {{g.tax.dot}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.2l2.6 2.6L11 4.5"></path></svg></span>
    </button>
    <button onClick="{{g.visa.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 66px; padding: 12px 16px; border-radius: 16px; border: 1.5px solid {{g.visa.bd}}; background: {{g.visa.bg}}; text-align: left; cursor: pointer">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#264E43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="4" width="16" height="22" rx="2.5"></rect><circle cx="15" cy="13" r="4" stroke-dasharray="2 1.6"></circle><path d="M11 20.5h8"></path></svg>
      <span style="flex-grow: 1"><span style="display: block; font-weight: 600; font-size: 15px; color: #1C2B26">Visa days</span><span style="display: block; font-size: 13px; color: #5E6D67; margin-top: 2px">Schengen 90/180, US and more</span></span>
      <span style="width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid {{g.visa.bd}}; background: {{g.visa.dot}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.2l2.6 2.6L11 4.5"></path></svg></span>
    </button>
    <button onClick="{{g.been.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 66px; padding: 12px 16px; border-radius: 16px; border: 1.5px solid {{g.been.bd}}; background: {{g.been.bg}}; text-align: left; cursor: pointer">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#264E43" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="15" cy="15" r="10.5"></circle><path d="M4.5 15h21M15 4.5c3.5 3.2 3.5 17.8 0 21M15 4.5c-3.5 3.2-3.5 17.8 0 21"></path></svg>
      <span style="flex-grow: 1"><span style="display: block; font-weight: 600; font-size: 15px; color: #1C2B26">See where I've been</span><span style="display: block; font-size: 13px; color: #5E6D67; margin-top: 2px">Your countries, stamps and years</span></span>
      <span style="width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid {{g.been.bd}}; background: {{g.been.dot}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.2l2.6 2.6L11 4.5"></path></svg></span>
    </button>
    <button onClick="{{g.cit.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 66px; padding: 12px 16px; border-radius: 16px; border: 1.5px solid {{g.cit.bd}}; background: {{g.cit.bg}}; text-align: left; cursor: pointer">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#264E43" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 24h4v-5h4v-5h4V9h4V5h4"></path><path d="M5 24h20" stroke-opacity="0.3"></path></svg>
      <span style="flex-grow: 1"><span style="display: block; font-weight: 600; font-size: 15px; color: #1C2B26">Citizenship progress</span><span style="display: block; font-size: 13px; color: #5E6D67; margin-top: 2px">Years and days towards a passport</span></span>
      <span style="width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid {{g.cit.bd}}; background: {{g.cit.dot}}; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.2l2.6 2.6L11 4.5"></path></svg></span>
    </button>
  </div>
  <div style="flex-grow: 1"></div>
  <p style="margin: 0 0 12px; text-align: center; font-size: 13px; color: #5E6D67">You can change this anytime.</p>
  <a href="Paywall.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #264E43; color: #FFFFFF; font-weight: 600; font-size: 16px">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { travel: false, tax: true, visa: true, been: false, cit: false }; }
  renderVals() {
    const mk = (k) => {
      const on = this.state[k];
      return { bg: on ? '#EEF6FF' : '#FFFFFF', bd: on ? '#264E43' : '#E3DED2', dot: on ? '#264E43' : '#FFFFFF', toggle: () => this.setState({ [k]: !this.state[k] }) };
    };
    return { g: { travel: mk('travel'), tax: mk('tax'), visa: mk('visa'), been: mk('been'), cit: mk('cit') } };
  }
}
</script>
</body>
</html>
