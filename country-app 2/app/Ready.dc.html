<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ready to count</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;color:#1C2B26}
a{color:#264E43;text-decoration:none}a:hover{color:#1C2B26}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ring{from{stroke-dashoffset:703.7}}
@keyframes glow{0%{transform:scale(.9);opacity:0}40%{opacity:.35}100%{transform:scale(1.25);opacity:0}}
@keyframes thunk{0%{opacity:0;transform:scale(1.7) rotate(0)}65%{opacity:1;transform:scale(.94) rotate(10deg)}100%{opacity:1;transform:rotate(10deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #264E43; padding: 80px 28px 36px; display: flex; flex-direction: column; align-items: center; text-align: center">
  <div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; letter-spacing: -0.03em; color: #CFE8FF; animation: rise .5s ease-out both"><span style="font-weight: 800">count</span><span style="font-weight: 300; color: #6D9488">ry</span></div>
  <div style="position: relative; margin-top: 40px; width: 260px; height: 260px">
    <span style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid #CFE8FF; animation: glow 1.2s ease-out 1.9s both"></span>
    <svg width="260" height="260" viewBox="0 0 260 260" fill="none" aria-hidden="true">
      <circle cx="130" cy="130" r="112" stroke="#3E6357" stroke-width="12"></circle>
      <circle cx="130" cy="130" r="112" stroke="#CFE8FF" stroke-width="12" stroke-linecap="round" stroke-dasharray="703.7" stroke-dashoffset="96" transform="rotate(-90 130 130)" style="animation: ring 1.8s cubic-bezier(.2,.8,.2,1) .3s both"></circle>
      <text x="130" y="112" text-anchor="middle" font-family="JetBrains Mono" font-size="10" letter-spacing="1.6" fill="#9CB9AF">UAE · 2026</text>
      <text x="130" y="162" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="300" font-size="64" fill="#FFFFFF">{{n}}</text>
      <text x="130" y="186" text-anchor="middle" font-family="Inter" font-size="13" fill="#CFE8FF">of 183 days</text>
    </svg>
    <svg width="96" height="64" viewBox="0 0 96 64" fill="none" style="position: absolute; right: -22px; bottom: 6px; animation: thunk .45s ease-out 2.1s both" aria-hidden="true"><ellipse cx="48" cy="32" rx="45" ry="29" fill="#264E43" stroke="#5EC4B6" stroke-width="2.2"></ellipse><ellipse cx="48" cy="32" rx="37" ry="21" stroke="#5EC4B6" stroke-width="1" stroke-dasharray="3 3"></ellipse><text x="48" y="31" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="14" fill="#5EC4B6">UAE</text><text x="48" y="44" text-anchor="middle" font-family="JetBrains Mono" font-size="7.5" fill="#5EC4B6">HOME · 2026</text></svg>
  </div>
  <h1 style="margin: 40px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.1; letter-spacing: -0.02em; color: #FFFFFF; animation: rise .5s ease-out 2.2s both">Ready to count your country?</h1>
  <p style="margin: 14px 0 0; font-size: 15px; line-height: 1.55; color: #CFE8FF; animation: rise .5s ease-out 2.35s both">You've spent 158 days in the UAE this year. From today, we'll keep counting for you.</p>
  <div style="flex-grow: 1"></div>
  <a href="Today.dc.html" style="align-self: stretch; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #CFE8FF; color: #264E43; font-weight: 600; font-size: 16px; animation: rise .5s ease-out 2.5s both">Let's go</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { n: 0 }; }
  componentDidMount() {
    const s = Date.now();
    this.t = setInterval(() => { const k = Math.min(1, (Date.now() - s - 300) / 1800); if (k < 0) return; this.setState({ n: Math.round(158 * (1 - Math.pow(1 - k, 3))) }); if (k >= 1) clearInterval(this.t); }, 30);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() { return { n: this.state.n }; }
}
</script>
</body>
</html>
