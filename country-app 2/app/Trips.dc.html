<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;color:#1C2B26}
a{color:#264E43;text-decoration:none}a:hover{color:#1C2B26}
button{font-family:inherit}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fly{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
@keyframes plane{from{offset-distance:0%}to{offset-distance:100%}}
.stg>*{animation:rise .45s ease-out both}.stg>*:nth-child(2){animation-delay:.06s}.stg>*:nth-child(3){animation-delay:.12s}.stg>*:nth-child(4){animation-delay:.18s}.stg>*:nth-child(5){animation-delay:.24s}
.strip{transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) .35s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 940px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <div class="stg" style="flex-grow: 1; padding: 54px 20px 0; display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; color: #264E43">Trips</h1>
      <a href="Planner.dc.html" aria-label="Plan a trip" style="height: 40px; padding: 0 14px 0 10px; border-radius: 20px; background: #264E43; display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: #FFFFFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Plan a trip</a>
    </div>

    <!-- Next trip -->
    <a href="TripDetail.dc.html" aria-label="Next trip: Madrid, Spain, 10 to 24 October, 5 days to go" style="position: relative; display: block; padding: 18px 18px 16px; border-radius: 24px; background: #264E43; color: #FFFFFF; overflow: hidden">
      <svg width="350" height="150" viewBox="0 0 350 150" fill="none" aria-hidden="true" style="position: absolute; right: -10px; top: -6px; opacity: .9">
        <path d="M205 122 C 235 60, 285 44, 320 70" stroke="#CFE8FF" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="3 5" style="animation: fly 1.4s ease-out .4s both" stroke-dashoffset="0"></path>
        <circle cx="205" cy="122" r="3" fill="#CFE8FF" fill-opacity=".7"></circle>
        <circle cx="320" cy="70" r="5" fill="#CFE8FF"></circle>
        <circle cx="320" cy="70" r="10" stroke="#CFE8FF" stroke-opacity=".4"></circle>
      </svg>
      <div style="position: relative; display: flex; align-items: center; justify-content: space-between">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .14em; color: #CFE8FF">NEXT TRIP</span>
        <span style="padding: 4px 10px; border-radius: 999px; background: rgba(207,232,255,.16); font-size: 12px; font-weight: 600; color: #CFE8FF">5 days to go</span>
      </div>
      <div style="position: relative; margin-top: 26px; display: flex; align-items: center; gap: 10px">
        <dc-import name="Flag" code="es" w="30" h="21" hint-size="30px,21px"></dc-import>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 38px; line-height: 1; letter-spacing: -0.03em">Madrid</span>
      </div>
      <div style="position: relative; margin-top: 8px; display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 14px; color: #E4F1FE">10 – 24 Oct · 15 days</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #CFE8FF">DXB → MAD</span>
      </div>
      <div style="position: relative; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(207,232,255,.22); display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #E4F1FE">
        <span style="width: 7px; height: 7px; border-radius: 4px; background: #E2B866"></span>Schengen <b style="color: #FFFFFF">62 of 90</b> after this trip
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CFE8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: auto"><path d="M9 5l7 7-7 7"></path></svg>
      </div>
    </a>

    <!-- Then -->
    <a href="TripDetail.dc.html#london" style="margin-top: -6px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; border: 1px solid #E3DED2; color: #1C2B26">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .12em; color: #5E6D67">THEN</span>
      <dc-import name="Flag" code="uk" w="24" h="17" hint-size="24px,17px"></dc-import>
      <span style="flex-grow: 1; font-size: 14px"><b style="font-weight: 600">London</b> <span style="color: #5E6D67">· 18 – 21 Dec</span></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA8A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </a>

    <!-- All trips -->
    <a href="TripsAll.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px 14px 14px; border-radius: 20px; border: 1px solid #E3DED2; color: #1C2B26">
      <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #E4F1FE; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"></path><circle cx="4.5" cy="6" r="1.2" fill="#264E43"></circle><circle cx="4.5" cy="12" r="1.2" fill="#264E43"></circle><circle cx="4.5" cy="18" r="1.2" fill="#264E43"></circle></svg></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 700; color: #264E43">All trips</span><span style="font-size: 12.5px; color: #5E6D67">8 past · 2 coming up</span></span>
      <span style="display: flex; gap: 3px">
        <sc-for list="{{stack}}" as="f" hint-placeholder-count="5"><dc-import name="Flag" code="{{f}}" w="18" h="13" hint-size="18px,13px"></dc-import></sc-for>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 5l7 7-7 7"></path></svg>
    </a>

    <!-- Your 2026 -->
    <a href="TripsAll.dc.html#year" aria-label="Your 2026: 8 trips, 110 days away, 5 countries. See your year" style="display: block; padding: 18px; border-radius: 22px; background: #F5F1E8; color: #1C2B26">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; color: #264E43">Your 2026</span>
        <span style="font-size: 12.5px; font-weight: 600; color: #264E43">See your year ›</span>
      </div>
      <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
          <div><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 300; font-size: 34px; line-height: 1; color: #264E43; font-variant-numeric: tabular-nums">{{s.v}}</div><div style="margin-top: 4px; font-size: 12.5px; color: #5E6D67">{{s.l}}</div></div>
        </sc-for>
      </div>
      <div style="margin-top: 18px; position: relative">
        <div class="strip" style="display: flex; height: 30px; border-radius: 8px; overflow: hidden">
          <sc-for list="{{segs}}" as="g" hint-placeholder-count="16">
            <span style="flex-grow: {{g.n}}; background: {{g.c}}"></span>
          </sc-for>
        </div>
        <span style="position: absolute; left: {{todayPct}}%; top: -5px; width: 2px; height: 40px; margin-left: -1px; border-radius: 1px; background: #1C2B26"></span>
        <div style="margin-top: 6px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #7A8983">
          <sc-for list="{{months}}" as="m" hint-placeholder-count="12"><span>{{m}}</span></sc-for>
        </div>
      </div>
      <div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: #4F6159">
        <sc-for list="{{legend}}" as="l" hint-placeholder-count="6"><span style="display: flex; align-items: center; gap: 5px"><span style="width: 9px; height: 9px; border-radius: 3px; background: {{l.c}}"></span>{{l.name}}</span></sc-for>
      </div>
    </a>


    <!-- Wrapped -->
    <a href="Wrapped.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: #264E43; color: #FFFFFF">
      <span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 17px; border: 3px solid #CFE8FF; box-sizing: border-box"></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Your year, wrapped</span><span style="font-size: 12.5px; color: #CFE8FF">Tap through your 2026</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CFE8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </a>
  </div>
  <dc-import name="TabBar" active="trips" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
  renderVals() {
    // days of 2026 so far, in order: [country, days]
    const seg = [['ae',20],['us',14],['ae',45],['uk',24],['it',8],['ae',18],['fr',12],['ae',21],['es',15],['uk',10],['ae',25],['es',20],['ae',17],['uk',7],['ae',12]];
    const col = { ae: '#264E43', uk: '#7FAFD9', es: '#E0A33A', fr: '#6D9488', it: '#C9705A', us: '#8C78B8' };
    const today = seg.reduce((a, s) => a + s[1], 0);
    const segs = seg.map(([c, n]) => ({ n, c: c === 'ae' ? '#C9D6D1' : col[c] }));
    segs.push({ n: 365 - today, c: '#FFFFFF' });
    const legend = [['ae','UAE · home'],['uk','UK'],['es','Spain'],['fr','France'],['it','Italy'],['us','USA']].map(([k, name]) => ({ c: k === 'ae' ? '#C9D6D1' : col[k], name }));
    return {
      stats: [{ v: '8', l: 'trips' }, { v: '110', l: 'days away' }, { v: '5', l: 'countries' }],
      segs, legend, todayPct: (today / 365 * 100).toFixed(1),
      months: ['J','F','M','A','M','J','J','A','S','O','N','D'],
      stack: ['uk', 'es', 'fr', 'it', 'us'],
    };
  }
}
</script>
</body>
</html>
