<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Free home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',sans-serif;color:#1C2B26}
a{color:#264E43;text-decoration:none}a:hover{color:#1C2B26}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ring{from{stroke-dashoffset:314.16}}
@keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg)}60%{transform:rotate(9deg)}}
.stg>*{animation:rise .45s ease-out both}.stg>*:nth-child(2){animation-delay:.06s}.stg>*:nth-child(3){animation-delay:.12s}.stg>*:nth-child(4){animation-delay:.2s}.stg>*:nth-child(5){animation-delay:.26s}.stg>*:nth-child(6){animation-delay:.32s}.stg>*:nth-child(n+7){animation-delay:.38s}
.lk{animation:wiggle .5s ease-in-out 1.2s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div class="stg" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; padding: 44px 20px 20px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; letter-spacing: -0.03em; color: #264E43"><span style="font-weight: 800">count</span><span style="font-weight: 300; color: #6D9488">ry</span></span>
    <a href="Paywall.dc.html" style="height: 34px; padding: 0 12px; border-radius: 17px; background: #E4F1FE; display: flex; align-items: center; font-size: 13px; font-weight: 600">Get Premium</a>
  </div>

  <a href="Check1.dc.html" style="margin-top: 16px; flex-shrink: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 16px 20px; border-radius: 24px; background: #264E43; color: #FFFFFF">
    <svg width="140" height="140" viewBox="0 0 120 120" fill="none" style="position: absolute; right: -24px; top: -20px" aria-hidden="true"><circle cx="60" cy="60" r="50" stroke="#3E6357" stroke-width="12"></circle><circle cx="60" cy="60" r="50" stroke="#CFE8FF" stroke-width="12" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="122" transform="rotate(-90 60 60)" style="animation: ring 1.4s cubic-bezier(.2,.8,.2,1) .3s both"></circle></svg>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #9CB9AF">QUICK CHECK · FREE</span>
    <span style="margin-top: 8px; max-width: 220px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; line-height: 1.1">How many days have I used?</span>
    <span style="margin-top: 8px; font-size: 13.5px; color: #CFE8FF">Schengen, UAE, UK or US. Answer in a minute.</span>
    <span style="margin-top: 12px; align-self: flex-start; height: 44px; padding: 0 18px; border-radius: 14px; background: #CFE8FF; color: #264E43; font-weight: 600; font-size: 15px; display: flex; align-items: center">Start a check</span>
  </a>
  <div style="margin-top: 10px; font-size: 12.5px; color: #5E6D67; text-align: center">Free checks aren't saved. Each one starts from zero.</div>

  <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: baseline">
    <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 18px; color: #264E43">Unlock with Premium</h2>
  </div>
  <div class="stg" style="margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
      <a href="Paywall.dc.html" style="position: relative; padding: 12px 12px 12px 14px; border-radius: 18px; background: {{t.bg}}; display: flex; flex-direction: column; justify-content: space-between; color: #1C2B26">
        <span class="lk" style="position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"></rect><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"></path></svg></span>
        <span style="width: 32px; height: 32px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{t.i1}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5" stroke-opacity="0.3"></circle><path d="M12 3.5A8.5 8.5 0 1 1 3.5 12"></path></svg></sc-if>
          <sc-if value="{{t.i2}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C0262D" stroke-width="1.9"><rect x="4" y="6" width="16" height="12" rx="3"></rect><path d="M8 12h8" stroke-dasharray="2 2"></path></svg></sc-if>
          <sc-if value="{{t.i3}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2.5"></rect><path d="M9 8v6M12 8v6M15 8v6M8 14.5l8-6"></path></svg></sc-if>
          <sc-if value="{{t.i4}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A5D0F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg></sc-if>
          <sc-if value="{{t.i5}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="1.9" stroke-linecap="round"><circle cx="9" cy="12" r="5.5"></circle><circle cx="15" cy="12" r="5.5"></circle></svg></sc-if>
          <sc-if value="{{t.i6}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#264E43" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.5 12h17M12 3.5c2.6 2.4 2.6 14.6 0 17"></path></svg></sc-if>
        </span>
        <span style="margin-top: 8px"><span style="display: block; font-size: 14px; font-weight: 600">{{t.title}}</span><span style="display: block; margin-top: 2px; font-size: 11.5px; line-height: 1.35; color: #4F6159">{{t.sub}}</span></span>
      </a>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="Paywall.dc.html" style="margin-top: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 16px; background: #264E43; color: #FFFFFF; font-weight: 600; font-size: 16px">Try Premium free for 3 days</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = [
      ['Counts on its own', 'Every day, automatically using your phones GPS and camera roll', '#E4F1FE', 'i1'],
      ['Saved forever', 'Your full history, backed up so you never miss a day', '#F5F1E8', 'i6'],
      ['Alerts before limits', '30 days ahead of every rule, even the ones you didn\u2019t book yet', '#FFF4DE', 'i4'],
      ['Map and stamps', 'Collect stamps from every country you visit and a map view of the world', '#FBE9E7', 'i2'],
      ['Reports', 'Download a full tax residency report making it easy to track', '#EAF3EE', 'i3'],
      ['Partner perks', 'Unlock worldwide partnership such as Holafly, Klook and more', '#EEE9FB', 'i5']
    ];
    const tiles = T.map(([title, sub, bg, ic]) => ({ title, sub, bg, i1: ic === 'i1', i2: ic === 'i2', i3: ic === 'i3', i4: ic === 'i4', i5: ic === 'i5', i6: ic === 'i6' }));
    return { tiles };
  }
}
</script>
</body>
</html>
